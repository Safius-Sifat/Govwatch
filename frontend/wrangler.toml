# Cloudflare Workers config for GovWatch frontend (OpenNext).
#
# Build & preview locally:
#   npm run preview
# Deploy:
#   npm run deploy

name = "govwatch"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# R2 incremental cache for Next.js — see open-next.config.ts
# Commented out until the R2 bucket is provisioned. Uncomment and set
# the bucket name once the cache bucket has been created in Cloudflare.
# [[r2_buckets]]
# binding = "NEXT_INC_CACHE_R2_BUCKET"
# bucket_name = "govwatch-next-cache"

# Non-secret env vars. Real secrets belong in `.dev.vars` (local) or
# `wrangler secret put <NAME>` (deployed).
[vars]
WORKER_URL = "https://shotto-gateway.safiussifat.workers.dev"
NEXTJS_ENV = "development"

# Observability gives request logs in the Cloudflare dashboard.
[observability]
enabled = true
